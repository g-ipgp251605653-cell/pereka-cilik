let page=0,selected=new Set(),ideas=new Set(),criteria=new Set(),answers=['','',''],drawn=false,tool='pen',strokes=[];
const aspects=[['Bentuk','Bentuk roket kurang jelas.'],['Warna','Warna kurang menyerlahkan tema.'],['Fungsi','Ruang simpanan tidak jelas.'],['Perincian','Lakaran kurang lengkap.']];
const suggestions=['Menambah muncung dan sirip roket yang lebih jelas.','Menggunakan gabungan warna yang menarik.','Menambah ruang menyimpan alat tulis.','Menambah tingkap, bintang dan corak angkasa.','Melabelkan bahagian penting pada lakaran.'];
const checks=['Bentuk roket jelas dan sesuai dengan tema.','Gabungan warna menarik dan bersesuaian.','Ruang menyimpan alat tulis ditunjukkan dengan jelas.','Lakaran mempunyai perincian dan label yang sesuai.','Sekurang-kurangnya dua penambahbaikan telah dilakukan.'];
const questions=['Apakah dua penambahbaikan yang telah anda lakukan pada lakaran asal?','Mengapakah anda memilih penambahbaikan tersebut?','Bagaimanakah lakaran baharu anda lebih baik berbanding lakaran asal?'];
function badge(t){return `<div class="step">${t}</div>`}function box(t){return `<div class="panel">${t}</div>`}function listItems(arr){return '<ol>'+arr.map(x=>'<li>'+x+'</li>').join('')+'</ol>'}function checkRows(arr,set){return arr.map((x,i)=>`<label class="check"><input type="checkbox" ${set.has(i)?'checked':''} onchange="toggle('${set===selected?'selected':set===ideas?'ideas':'criteria'}',${i},this.checked)"><span>${Array.isArray(x)?`<strong>${x[0]}</strong> – ${x[1]}`:x}</span></label>`).join('')}
function toggle(type,i,v){let s=type==='selected'?selected:type==='ideas'?ideas:criteria;v?s.add(i):s.delete(i);if(type==='ideas')document.getElementById('ideaStatus').textContent=s.size>=2?'Bagus! Anda telah memilih sekurang-kurangnya dua idea.':`Anda memilih ${s.size} idea. Pilih sekurang-kurangnya dua.`;if(type==='criteria'){document.getElementById('count').textContent=`${s.size}/5`;document.getElementById('checkStatus').textContent=s.size===5?'Syabas! Semua kriteria telah disemak.':'Semak aspek yang belum dipenuhi dan baiki lakaran jika perlu.'}}
function saveAnswer(i,v){answers[i]=v}
const views=[
()=>`${badge('Skrin 1 · Muka depan')}<div class="hero"><div><h1>PEREKA CILIK KREATIF</h1><p class="lead">🚀 Misi Reka Bentuk Angkasa!</p><p>Tahniah, Pereka Cilik! Anda telah berjaya mengenal pasti kelemahan dan mencadangkan penambahbaikan pada lakaran bekas alat tulis bertemakan angkasa lepas. Kini tiba masanya untuk menghasilkan lakaran kreatif anda sendiri!</p><button class="btn warn" onclick="go(1)">🚀 MULAKAN AKTIVITI</button></div><div class="hero-art">🪐✏️🚀</div></div>`,
()=>`${badge('Skrin 2 · Arahan aktiviti')}<h2>SELAMAT DATANG KE STUDIO PEREKA CILIK!</h2><p class="lead">Anda ditugaskan untuk menghasilkan satu lakaran bekas alat tulis bertemakan angkasa lepas yang lebih menarik, lengkap dan berfungsi.</p>${box(listItems(['Perhatikan lakaran asal yang diberikan.','Kenal pasti kelemahan lakaran tersebut.','Rancang sekurang-kurangnya dua penambahbaikan.','Hasilkan lakaran baharu berdasarkan idea anda.','Warnakan dan labelkan bahagian penting.','Nilai lakaran yang telah dihasilkan.']))}<button class="btn warn" onclick="go(2)">SAYA BERSEDIA!</button>`,
()=>`${badge('Skrin 3 · Pemerhatian visual')}<h2>KENALI LAKARAN ASAL</h2><div class="grid"><div><img class="art" src="${oldImage}" alt="Lakaran asal bekas alat tulis roket biru dengan satu tingkap dan sirip merah"></div><div><p>Perhatikan lakaran bekas alat tulis ini. Lakaran tersebut sudah mempunyai tema angkasa lepas, tetapi masih boleh ditambah baik dari segi bentuk, warna, fungsi dan perincian.</p>${box('<strong>Soalan pemerhatian:</strong>'+listItems(['Adakah bentuk roket cukup jelas?','Adakah warna yang digunakan sesuai?','Adakah ruang menyimpan alat tulis berfungsi dengan baik?','Adakah lakaran mempunyai perincian yang lengkap?']))}</div></div><button class="btn warn" onclick="go(3)">SAYA SUDAH PERHATIKAN</button>`,
()=>`${badge('Skrin 4 · Misi 1')}<h2>JADI DETEKTIF REKA BENTUK!</h2><p>Pilih aspek yang perlu ditambah baik pada lakaran asal.</p>${checkRows(aspects,selected)}<div class="feedback">Bagus! Setiap kelemahan yang dikenal pasti membantu anda merancang lakaran yang lebih baik.</div>`,
()=>`${badge('Skrin 5 · Misi 2')}<h2>RANCANG REKA BENTUK ANDA!</h2><p>Pilih sekurang-kurangnya dua cadangan penambahbaikan untuk menghasilkan lakaran baharu.</p>${checkRows(suggestions,ideas)}<div class="feedback" id="ideaStatus">${ideas.size>=2?'Bagus! Anda telah memilih sekurang-kurangnya dua idea.':`Anda memilih ${ideas.size} idea. Pilih sekurang-kurangnya dua.`}</div>`,
()=>`${badge('Skrin 6 · Misi 3')}<h2>JOM MELAKAR!</h2><p>Ikuti panduan ini untuk menghasilkan lakaran yang lebih kreatif.</p><div class="grid">${[['01','Lakarkan bentuk asas','Lukiskan bentuk utama bekas alat tulis seperti badan roket.'],['02','Tambahkan ciri roket','Lukiskan muncung, sirip dan tingkap supaya tema lebih jelas.'],['03','Tambahkan fungsi','Tunjukkan ruang menyimpan pensel, pen dan pembaris.'],['04','Warnakan dan labelkan','Gunakan warna yang sesuai serta tambahkan label bahagian produk.']].map(a=>`<div class="tile"><div class="step">LANGKAH ${a[0]}</div><h3>${a[1]}</h3><p>${a[2]}</p></div>`).join('')}</div><button class="btn warn" onclick="go(6)">SAYA BERSEDIA MELAKAR</button>`,
()=>`${badge('Skrin 7 · Misi 4')}<h2>HASILKAN LAKARAN ANDA!</h2><p>Sekarang, hasilkan lakaran bekas alat tulis bertemakan angkasa lepas berdasarkan idea penambahbaikan yang telah anda pilih.</p><div class="note"><strong>Pilihan pelaksanaan:</strong> Anda boleh melakar di atas kertas atau menggunakan studio lakaran digital di bawah. Pastikan lakaran mempunyai sekurang-kurangnya dua penambahbaikan berbanding lakaran asal.</div><div class="toolbar"><label>Warna <input type="color" id="color" value="#2463c6"></label><label>Saiz <input type="range" id="size" min="2" max="26" value="5"></label><button class="btn secondary" onclick="tool='pen'">✏️ Pensel</button><button class="btn secondary" onclick="tool='erase'">◻ Pemadam</button><button class="btn secondary" onclick="clearCanvas()">Padam semua</button><button class="btn warn" onclick="savePNG()">⬇ Simpan lakaran PNG</button></div><div class="draw-wrap"><canvas id="canvas" width="960" height="530" aria-label="Ruang melukis bebas menggunakan tetikus atau sentuhan"></canvas></div><p class="muted">Lakaran digital boleh disimpan sebagai PNG. Jika menggunakan kertas, teruskan ke skrin seterusnya setelah siap.</p>`,
()=>`${badge('Skrin 8 · Misi 5')}<h2>JADI PENILAI REKA BENTUK!</h2><p>Semak lakaran anda berdasarkan kriteria yang diberikan.</p>${checkRows(checks,criteria)}<div class="feedback"><strong>Kemajuan semakan: <span id="count">${criteria.size}/5</span></strong><div id="checkStatus">${criteria.size===5?'Syabas! Semua kriteria telah disemak.':'Semak aspek yang belum dipenuhi dan baiki lakaran jika perlu.'}</div></div>`,
()=>`${badge('Skrin 9 · Refleksi')}<h2>CERITAKAN IDEA KREATIF ANDA!</h2><p>Setiap pereka mempunyai idea yang tersendiri. Jelaskan keputusan reka bentuk yang telah anda buat.</p>${questions.map((q,i)=>`<div class="panel"><label for="q${i}"><strong>${i+1}. ${q}</strong></label><textarea id="q${i}" placeholder="Tulis jawapan anda..." oninput="saveAnswer(${i},this.value)"></textarea></div>`).join('')}<button class="btn warn" onclick="copyReflection()">📋 Salin refleksi</button><p class="muted">Jawapan refleksi disimpan dalam sesi semasa; salin untuk menyerahkannya kepada guru.</p>`,
()=>`${badge('Skrin 10 · Galeri pereka cilik')}<h1>TAHNIAH, PEREKA CILIK KREATIF! 🎉</h1><p class="lead">Anda telah berjaya menghasilkan lakaran bekas alat tulis bertemakan angkasa lepas yang ditambah baik. Setiap idea kreatif anda menunjukkan usaha untuk menghasilkan reka bentuk yang lebih menarik dan berfungsi!</p>${box('<h3>Pencapaian anda</h3>'+listItems(['Mengenal pasti kelemahan lakaran asal.','Merancang sekurang-kurangnya dua penambahbaikan.','Menghasilkan lakaran baharu.','Menilai hasil lakaran sendiri.','Memberikan alasan terhadap keputusan reka bentuk.']))}<div class="grid"><button class="btn warn" onclick="go(6)">🖼️ LIHAT LAKARAN</button><button class="btn" onclick="resetAll()">↻ ULANG AKTIVITI</button></div><p class="muted">Galeri kelas boleh dibina oleh guru menggunakan hasil murid yang telah dikumpulkan dengan kebenaran yang sesuai.</p>`];
function go(n){if(n<0||n>=views.length)return;if(page===6)capture();page=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('screen').innerHTML=views[page]();document.getElementById('bar').style.width=((page+1)*10)+'%';document.getElementById('back').style.display=page===0?'none':'';document.getElementById('next').style.display=page===9?'none':'';if(page===6)initCanvas();if(page===8)answers.forEach((a,i)=>document.getElementById('q'+i).value=a)}
let ctx,canvas,drawing=false,last=null;function initCanvas(){canvas=document.getElementById('canvas');ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);if(strokes.length){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=strokes[0]};canvas.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);canvas.setPointerCapture(e.pointerId);mark(last,last)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;let p=pos(e);mark(last,p);last=p});canvas.addEventListener('pointerup',()=>{drawing=false;capture()});canvas.addEventListener('pointercancel',()=>{drawing=false;capture()})}function pos(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function mark(a,b){ctx.strokeStyle=tool==='erase'?'white':document.getElementById('color').value;ctx.lineWidth=Number(document.getElementById('size').value)*(tool==='erase'?2.7:1);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();drawn=true}function capture(){if(canvas&&page===6)strokes=[canvas.toDataURL('image/png')]}function clearCanvas(){if(!ctx)return;ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);strokes=[];drawn=false}function savePNG(){if(!canvas)return;let a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='lakaran-pereka-cilik-kreatif.png';a.click()}function copyReflection(){let s=questions.map((q,i)=>`${i+1}. ${q}\n${answers[i]||'(Belum dijawab)'}`).join('\n\n');if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>alert('Refleksi telah disalin.'),()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let t=document.createElement('textarea');t.value=s;document.body.appendChild(t);t.select();try{document.execCommand('copy');alert('Refleksi telah disalin.')}catch(e){alert('Sila salin jawapan secara manual.')}t.remove()}function resetAll(){selected=new Set();ideas=new Set();criteria=new Set();answers=['','',''];strokes=[];drawn=false;tool='pen';canvas=null;ctx=null;page=0;render();window.scrollTo(0,0)}render();
</script></body></html>
